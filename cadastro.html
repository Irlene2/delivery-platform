<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKI Delivery | Cadastro</title>
<link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/login.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <a href="../index.html" class="logo" aria-label="AKI Delivery"><span class="login-brand-mark"><span class="material-symbols-outlined">lunch_dining</span></span><span class="login-brand-text">Aki<small>DELIVERY</small></span></a>
  <button class="theme-toggle" data-theme-toggle aria-label="Alternar tema" type="button"><span class="material-icons">dark_mode</span></button>
</header>
<main class="landing"><section class="login-container" style="position:relative;margin:auto">
<div class="login-card">
  <div class="login-header"><div class="login-badge"><span class="material-icons">person_add</span> NOVA CONTA</div><h1>Criar sua conta</h1><p>O backend atual exige telefone e código de verificação. O e-mail abaixo é apenas informativo e não é salvo pela API.</p></div>
  <form id="registerForm" class="login-form">
    <div class="form-group"><label class="form-label" for="name">Nome completo</label><div class="input-container"><span class="material-icons input-icon">person</span><input id="name" required minlength="2" autocomplete="name" placeholder="Seu nome"></div></div>
    <div class="form-group"><label class="form-label" for="email">E-mail (opcional, não enviado ao backend)</label><div class="input-container"><span class="material-icons input-icon">mail</span><input id="email" type="email" autocomplete="email" placeholder="voce@email.com"></div></div>
    <div class="form-group"><label class="form-label" for="phone">Telefone</label><div class="input-container"><span class="material-icons input-icon">phone</span><input id="phone" type="tel" autocomplete="tel" placeholder="(21) 99999-0000"></div></div>
    <div class="form-group"><label class="form-label" for="code">Código de verificação</label><div class="input-container"><span class="material-icons input-icon">verified_user</span><input id="code" type="text" required autocomplete="one-time-code" placeholder="Código recebido no telefone"></div><small>Primeiro, solicite o código pelo botão abaixo.</small></div>
    <button class="btn btn-light full" id="requestCode" type="button" style="margin-bottom:14px;justify-content:center">Solicitar código por SMS</button>
    <div class="form-group"><label class="form-label" for="password">Senha (mínimo de 8 caracteres)</label><div class="input-container"><span class="material-icons input-icon">lock</span><input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo de 6 caracteres"></div></div>
    <div class="form-group"><label class="form-label" for="confirm">Confirmar senha</label><div class="input-container"><span class="material-icons input-icon">lock_reset</span><input id="confirm" type="password" required minlength="8" autocomplete="new-password" placeholder="Repita sua senha"></div></div>
    <p id="registerMessage" class="error-message" role="alert"></p>
    <button class="login-button" id="registerButton" type="submit"><span class="button-text">Criar conta</span></button>
    <a class="btn btn-light full" href="../index.html" style="margin-top:10px;justify-content:center">Voltar para o início</a>
  </form>
</div></section></main>
<script src="../js/tema.js"></script>
<script src="../js/platform-api.js"></script>
<script>
const form = document.getElementById('registerForm');
const msg = document.getElementById('registerMessage');
const codeButton = document.getElementById('requestCode');
const phoneInput = document.getElementById('phone');
const setMessage = (text, ok=false) => { msg.textContent=text; msg.className=ok?'success-message':'error-message'; };
codeButton.addEventListener('click', async () => {
  const phone = phoneInput.value.trim();
  if (phone.replace(/\D/g,'').length < 10) { setMessage('Informe um telefone válido com DDD antes de solicitar o código.'); phoneInput.focus(); return; }
  codeButton.disabled = true; codeButton.textContent = 'Solicitando…';
  try { await window.AKIPlatform.solicitarCodigo(phone); setMessage('Solicitação processada. Se o telefone puder receber um código, confira as instruções do provedor de verificação.', true); }
  catch (e) { setMessage(e.message || 'Não foi possível solicitar o código.'); }
  finally { codeButton.disabled=false; codeButton.textContent='Solicitar código por SMS'; }
});
form.addEventListener('submit', async e => {
  e.preventDefault(); setMessage('');
  const nome=document.getElementById('name').value.trim();
  const telefone=phoneInput.value.trim();
  const codigo=document.getElementById('code').value.trim();
  const senha=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  if(nome.length<2){setMessage('Informe seu nome completo.');return;}
  if(telefone.replace(/\D/g,'').length<10){setMessage('Informe um telefone válido com DDD.');return;}
  if(!codigo){setMessage('Solicite e informe o código de verificação.');return;}
  if(senha.length<8){setMessage('A senha deve ter pelo menos 8 caracteres.');return;}
  if(senha!==confirm){setMessage('As senhas não coincidem.');return;}
  const button=document.getElementById('registerButton'); button.disabled=true;
  try {
    await window.AKIPlatform.cadastrar({nome,telefone,codigo,senha});
    setMessage('Cadastro concluído. Agora entre com seu telefone e senha.', true);
    setTimeout(()=>{window.location.href='../index.html';}, 1000);
  } catch(e) { setMessage(e.message || 'Não foi possível concluir o cadastro.'); }
  finally { button.disabled=false; }
});
</script>
</body></html>
