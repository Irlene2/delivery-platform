server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: conversation-service

  mongodb:
    # spring.mongodb.*, e não spring.data.mongodb.*: no Boot 4 a chave antiga
    # está depreciada com nível error e NÃO É LIDA — o serviço cairia em
    # mongodb://localhost/test, que numa máquina de desenvolvimento é o Mongo do
    # compose. Foi o que aconteceu com o catalog na G-B1.
    uri: ${MONGO_URI:mongodb://localhost:27017/conversation_db?replicaSet=rs0}
    representation:
      # O padrão do driver é `unspecified`, e com ele o driver se recusa a
      # gravar UUID. Também descoberto na G-B1.
      uuid: standard

  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 5

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

# Mongock cumpre para o MongoDB o papel do Flyway no SQL — ADR-017.
# ATENÇÃO: este bloco é irmão de `spring`, não filho. Aninhá-lo por engano
# esconde tudo o que vier depois dentro de `mongock` e o Spring ignora em
# silêncio — foi o que aconteceu no catalog-service e no notification-service.
mongock:
  migration-scan-package:
    - com.deliveryplatform.conversation.infrastructure.persistence.migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.deliveryplatform: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
